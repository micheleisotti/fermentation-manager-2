[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fermentation-manager"
version = "2.0.0.dev0"
description = "Monitoring, control and analysis of lab-scale batch fermentations (Applikon ez2-Control)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michele Isotti" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "websockets>=12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fm2-server = "fm2.main:run_server"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
